<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1"><title>Probe 3</title>
<style type="text/css">body{background:#000;color:#0f0;font:12px Monaco,monospace;margin:0;padding:10px}</style></head>
<body><div id="log">plugin probe</div>
<script type="text/javascript">
var pl = []; var fl = 'none';
try { for (var i = 0; i < navigator.plugins.length; i++) { var p = navigator.plugins[i]; pl.push(p.name + ' [' + p.description + ']'); if (p.name.indexOf('Shockwave Flash') >= 0) { fl = p.description; } } } catch (e) {}
var img = new Image(); img.src = '/telemetry?probe3=1&flash=' + encodeURIComponent(fl) + '&plugins=' + encodeURIComponent(pl.join(' | ')) + '&r=' + new Date().getTime();
document.getElementById('log').innerHTML = pl.join('<br>');
</script></body></html>
