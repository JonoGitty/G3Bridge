<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1"><title>BACKROOMS TAPE</title>
<style type="text/css">html,body{background:#000;margin:0;padding:0;overflow:hidden}#w{width:1024px;margin:0 auto}</style></head>
<body><div id="w">
<script type="text/javascript">
// pass the page's query string to the SWF as flashvars (bench=1, rc=1, seed=N, auto=1)
var q = window.location.search ? window.location.search.substring(1) : "";
document.write('<object id="bk" type="application/x-shockwave-flash" data="/games/backrooms/backrooms.swf?' + q + '" width="1024" height="617">'
 + '<param name="movie" value="/games/backrooms/backrooms.swf?' + q + '">'
 + '<param name="flashvars" value="' + q.replace(/"/g, '') + '">'
 + '<param name="allowScriptAccess" value="always"><param name="allowFullScreen" value="true">'
 + '<param name="quality" value="low"><param name="bgcolor" value="#000000"><param name="menu" value="false"><param name="wmode" value="window">'
 + '<p style="color:#8b949e;font:13px Monaco,monospace;padding:40px">This needs the Flash Player 10.1 plug-in. See Setup.</p></object>');
</script>
</div></body></html>
